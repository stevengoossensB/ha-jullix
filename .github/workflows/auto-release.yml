name: Auto Release

# Creates a GitHub release automatically whenever the integration version in
# manifest.json changes on main. Also runnable manually (workflow_dispatch) to
# release whatever version the manifest currently declares.
#
# The release zip is built and attached here directly: a release published by
# the default GITHUB_TOKEN does not trigger other workflows (e.g. release.yml),
# so this job must not depend on that cascade.

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/jullix/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: ver
        run: |
          version=$(python -c "import json; print(json.load(open('custom_components/jullix/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git rev-parse "refs/tags/${{ steps.ver.outputs.version }}" >/dev/null 2>&1 \
             || gh release view "${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.version }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build integration zip
        if: steps.check.outputs.exists == 'false'
        run: |
          cd custom_components/jullix
          zip -r jullix.zip ./ -x '*__pycache__*'

      - name: Create release and attach zip
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: custom_components/jullix/jullix.zip
