name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and attach release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set version in manifest
        run: |
          version="${GITHUB_REF#refs/tags/}"
          python - "$version" <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("custom_components/jullix/manifest.json")
          m = json.loads(p.read_text())
          m["version"] = sys.argv[1]
          p.write_text(json.dumps(m, indent=2) + "\n")
          PY

      - name: Create zip
        run: |
          cd custom_components/jullix
          zip -r jullix.zip ./ -x '*__pycache__*'

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/jullix/jullix.zip
